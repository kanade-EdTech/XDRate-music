[package]
name = "xdrate-music"
version = "0.4.1"
description = "XDRate Music desktop shell"
authors = ["Kehun_EdTech"]
license = "MIT"
repository = "https://github.com/Kehun-Edu-Tech/XDRate"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "xdrate_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_UI_Shell"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
